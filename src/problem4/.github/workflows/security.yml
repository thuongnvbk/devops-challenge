name: security

# Repository-wide checks with no path filters, so they run on every change:
# secrets anywhere in history (gitleaks) and workflow security lint (zizmor).
# Both tools are pinned and integrity-checked without trusting the download
# source: gitleaks is built from a module version verified by the Go checksum
# database; zizmor is installed from hash-pinned PyPI wheels.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --verbose .

  workflows:
    name: zizmor (workflow security)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor (hash-pinned)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --no-deps --require-hashes -r ci/requirements.txt

      # Online audits (e.g. known-vulnerable or impostor action commits) use
      # the job token, read-only.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --config .github/zizmor.yml --format github .github/workflows'
