# promtool test rules disk-alerts.test.yml
rule_files:
  - disk-alerts.rules.yml

evaluation_interval: 1m

tests:
  # 64 GiB root losing 50 MiB/min (3 GiB/h) from 12 GiB available: full in ~4h.
  - name: steady fill pages within the 4h horizon and tickets the 24h one
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '68719476736+0x240'
      - series: 'node_filesystem_avail_bytes{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '12884901888-52428800x240'
      - series: 'node_filesystem_readonly{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '0+0x240'
    alert_rule_test:
      - eval_time: 30m
        alertname: FilesystemWillFillIn4h
        exp_alerts:
          - exp_labels:
              severity: page
              job: node
              instance: lb-1:9100
              device: /dev/mapper/ubuntu--vg-ubuntu--lv
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "lb-1:9100:/ will run out of space within 4h"
              description: "16.46% available and falling at the 1h trend. NGINX workers get ENOSPC at 0."
              runbook_url: "https://runbooks.example.com/nginx-lb/disk-full"
      - eval_time: 30m
        alertname: FilesystemAlmostFull
        exp_alerts: []
      - eval_time: 30m
        alertname: FilesystemWillFillIn1h
        exp_alerts: []
      - eval_time: 30m
        alertname: FilesystemWillFillIn24h
        exp_alerts: [] # still pending: for 1h
      - eval_time: 90m
        alertname: FilesystemWillFillIn24h
        exp_alerts:
          - exp_labels:
              severity: ticket
              job: node
              instance: lb-1:9100
              device: /dev/mapper/ubuntu--vg-ubuntu--lv
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "lb-1:9100:/ will run out of space within 24h"
              description: "11.88% available and falling at the 6h trend."
              runbook_url: "https://runbooks.example.com/nginx-lb/disk-full"

  # Log flood: 200 MiB/min from 6 GiB available, full in ~30 min. The 1h alert
  # must page while the 4h one is still pending.
  - name: fast fill pages within minutes
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '68719476736+0x30'
      - series: 'node_filesystem_avail_bytes{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '6442450944-209715200x30'
      - series: 'node_filesystem_readonly{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 8m
        alertname: FilesystemWillFillIn1h
        exp_alerts:
          - exp_labels:
              severity: page
              job: node
              instance: lb-1:9100
              device: /dev/mapper/ubuntu--vg-ubuntu--lv
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "lb-1:9100:/ will run out of space within 1h"
              description: "6.934% available and falling fast (30m trend). NGINX workers get ENOSPC at 0."
              runbook_url: "https://runbooks.example.com/nginx-lb/disk-full"
      - eval_time: 8m
        alertname: FilesystemWillFillIn4h
        exp_alerts: [] # still pending: for 15m
      - eval_time: 8m
        alertname: FilesystemAlmostFull
        exp_alerts: []

  # Flood from half full: 2 GiB/min from 32 GiB available, ENOSPC at minute 16.
  # The percentage-gated rules cannot fire in time; the emergency path must.
  - name: flood from half full pages on the emergency path
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '68719476736+0x16'
      - series: 'node_filesystem_avail_bytes{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '34359738368-2147483648x16'
      - series: 'node_filesystem_readonly{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '0+0x16'
    alert_rule_test:
      - eval_time: 4m
        alertname: FilesystemExhaustionImminent
        exp_alerts:
          - exp_labels:
              severity: page
              job: node
              instance: lb-1:9100
              device: /dev/mapper/ubuntu--vg-ubuntu--lv
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "lb-1:9100:/ runs out of space in about 12m 0s"
              description: "At the 10m trend this filesystem is full within 30 minutes. Mitigate first (runbook step 2), diagnose second."
              runbook_url: "https://runbooks.example.com/nginx-lb/disk-full"
      - eval_time: 4m
        alertname: FilesystemWillFillIn1h
        exp_alerts: []
      - eval_time: 4m
        alertname: FilesystemWillFillIn4h
        exp_alerts: []

  # ext4 errors=remount-ro at minute 10: the read-only page fires, the space
  # rules (which exclude read-only mounts) cannot.
  - name: read-only remount pages
    interval: 1m
    input_series:
      - series: 'node_filesystem_readonly{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '0+0x9 1+0x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: FilesystemReadOnly
        exp_alerts: []
      - eval_time: 15m
        alertname: FilesystemReadOnly
        exp_alerts:
          - exp_labels:
              severity: page
              job: node
              instance: lb-1:9100
              device: /dev/mapper/ubuntu--vg-ubuntu--lv
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "lb-1:9100:/ is mounted read-only"
              description: "Usually an ext4 error remount. NGINX cannot log, buffer or cache; check dmesg before anything else."
              runbook_url: "https://runbooks.example.com/nginx-lb/disk-full"

  # 4M inodes, 1M free, 100k/min consumed: exhausted at minute 10, before the
  # gated inode rules could fire.
  - name: fast inode exhaustion pages on the emergency path
    interval: 1m
    input_series:
      - series: 'node_filesystem_files{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '4000000+0x10'
      - series: 'node_filesystem_files_free{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '1000000-100000x10'
      - series: 'node_filesystem_readonly{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: FilesystemInodesExhaustionImminent
        exp_alerts:
          - exp_labels:
              severity: page
              job: node
              instance: lb-1:9100
              device: /dev/mapper/ubuntu--vg-ubuntu--lv
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "lb-1:9100:/ runs out of inodes in about 6m 0s"
              description: "At the 10m trend inodes are exhausted within 30 minutes: ENOSPC despite free blocks."
              runbook_url: "https://runbooks.example.com/nginx-lb/disk-full"
      - eval_time: 4m
        alertname: FilesystemInodesWillFillIn4h
        exp_alerts: []
      - eval_time: 4m
        alertname: FilesystemInodesAlmostFull
        exp_alerts: []

  # Intentional read-only bind mount used for diagnosis must not page.
  - name: intentional read-only bind mount does not page
    interval: 1m
    input_series:
      - series: 'node_filesystem_readonly{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/mnt/rootfs"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: FilesystemReadOnly
        exp_alerts: []

  # The brief's scenario: "consistently at 99%". Zero slope, so no trend alert
  # can fire; only the floor catches it.
  - name: flat line at 99 percent is caught only by the floor alert
    interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '68719476736+0x60'
      - series: 'node_filesystem_avail_bytes{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '687194767+0x60'
      - series: 'node_filesystem_readonly{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: FilesystemExhaustionImminent
        exp_alerts: []
      - eval_time: 30m
        alertname: FilesystemWillFillIn1h
        exp_alerts: []
      - eval_time: 30m
        alertname: FilesystemWillFillIn4h
        exp_alerts: []
      - eval_time: 30m
        alertname: FilesystemWillFillIn24h
        exp_alerts: []
      - eval_time: 30m
        alertname: FilesystemAlmostFull
        exp_alerts:
          - exp_labels:
              severity: page
              job: node
              instance: lb-1:9100
              device: /dev/mapper/ubuntu--vg-ubuntu--lv
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "lb-1:9100:/ has under 5% space available"
              description: "1% available. One log burst or a few large buffered responses away from ENOSPC."
              runbook_url: "https://runbooks.example.com/nginx-lb/disk-full"

  # Millions of small cache objects: 3000 inodes/min against 600k free.
  - name: inode exhaustion pages with free blocks
    interval: 1m
    input_series:
      - series: 'node_filesystem_files{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '4194304+0x60'
      - series: 'node_filesystem_files_free{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '600000-3000x60'
      - series: 'node_filesystem_readonly{job="node", instance="lb-1:9100", device="/dev/mapper/ubuntu--vg-ubuntu--lv", fstype="ext4", mountpoint="/"}'
        values: '0+0x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: FilesystemInodesWillFillIn4h
        exp_alerts:
          - exp_labels:
              severity: page
              job: node
              instance: lb-1:9100
              device: /dev/mapper/ubuntu--vg-ubuntu--lv
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: "lb-1:9100:/ will run out of inodes within 4h"
              description: "12.16% of inodes free and falling. ENOSPC despite free blocks; usually millions of small cache objects."
              runbook_url: "https://runbooks.example.com/nginx-lb/disk-full"

  # 10 GiB held by a rotated log NGINX never reopened.
  - name: deleted-open bytes open a ticket after 30m
    interval: 1m
    input_series:
      - series: 'filesystem_deleted_open_bytes{job="node", instance="lb-1:9100", mountpoint="/"}'
        values: '10737418240+0x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: DeletedFilesHoldingSpace
        exp_alerts: []
      - eval_time: 40m
        alertname: DeletedFilesHoldingSpace
        exp_alerts:
          - exp_labels:
              severity: ticket
              job: node
              instance: lb-1:9100
              mountpoint: /
            exp_annotations:
              summary: "lb-1:9100:/ has 10GiB in deleted-but-open files"
              description: "Space df counts and du cannot see. Identify the holder with lsof -a +L1 before acting (runbook steps 2-3)."
              runbook_url: "https://runbooks.example.com/nginx-lb/disk-full"

  # Collector writes every minute for 10m, then stops.
  - name: stale collector is detected
    interval: 1m
    input_series:
      - series: 'node_textfile_mtime_seconds{job="node", instance="lb-1:9100", file="/run/node-exporter/textfile/filesystem_deleted_open.prom"}'
        values: '0+60x10 600+0x50'
    alert_rule_test:
      - eval_time: 20m
        alertname: DeletedOpenCollectorBroken
        exp_alerts: []
      - eval_time: 35m
        alertname: DeletedOpenCollectorBroken
        exp_alerts:
          - exp_labels:
              severity: ticket
              job: node
              instance: lb-1:9100
              file: /run/node-exporter/textfile/filesystem_deleted_open.prom
            exp_annotations:
              summary: "lb-1:9100 deleted-open-files metric is stale, missing or unreadable"
              description: "Check the systemd timer, the textfile directory (on tmpfs) and node_textfile_scrape_error."
              runbook_url: "https://runbooks.example.com/nginx-lb/disk-full"

  # After a reboot /run is empty and the timer is broken: no mtime series at all.
  - name: missing collector output is detected
    interval: 1m
    input_series:
      - series: 'up{job="node", instance="lb-1:9100"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: DeletedOpenCollectorBroken
        exp_alerts:
          - exp_labels:
              severity: ticket
              job: node
              instance: lb-1:9100
            exp_annotations:
              summary: "lb-1:9100 deleted-open-files metric is stale, missing or unreadable"
              description: "Check the systemd timer, the textfile directory (on tmpfs) and node_textfile_scrape_error."
              runbook_url: "https://runbooks.example.com/nginx-lb/disk-full"
