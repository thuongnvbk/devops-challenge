# JSON access log with upstream address, status and timings: the fields behind
# the 5xx-rate and latency alerts, and what pinpoints a wrong port or stale IP.
log_format json_upstream escape=json
    '{"ts":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_response_time":"$upstream_response_time"}';

server {
    listen 80;
    access_log /var/log/nginx/access.log json_upstream;

    # Resolve "api" through Docker's embedded DNS at request time instead of
    # once at startup. valid=5s caps how long an answer is cached, so a
    # recreated api container's new IP is used once the cached one expires; it
    # is not a recovery-time guarantee. nginx also starts while the api is down.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $api_upstream http://api:3000;

    location = / {
        default_type text/plain;
        return 200 "Welcome to the platform\n";
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}
