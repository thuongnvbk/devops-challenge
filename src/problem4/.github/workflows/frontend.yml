name: frontend

# PRs: verify, test, scan, build. main: the same, then attest and promote the
# exact built bundle staging -> production (approval on production).
on:
  pull_request:
    paths:
      - frontend/**
      - ci/**
      - .github/workflows/frontend*.yml
  push:
    branches: [main]
    paths:
      - frontend/**
      - ci/**
      - .github/workflows/frontend*.yml
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: typecheck, test, scan, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Lockfile-exact install; dependency install scripts never run.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify registry signatures of installed packages
        run: npm audit signatures

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Every dependency is a devDependency: the bundle has no runtime deps,
      # and Vite/Rolldown/TypeScript produce the bytes that ship. So audit the
      # whole tree; `--omit=dev` would audit nothing.
      - name: Vulnerability scan
        run: npm audit --audit-level=high

      - name: Build
        env:
          VITE_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Release path tests (order, restore, immutability, tamper refusal)
        run: ./deploy/release_test.sh dist

      - name: Package
        id: package
        run: |
          out="$GITHUB_WORKSPACE/.release"
          mkdir -p "$out"
          ../ci/deterministic-tar.sh dist "$out/site.tar.gz"
          echo "sha256=$(sha256sum "$out/site.tar.gz" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      # Resolved dependency tree of the build (lockfile + installed packages).
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: frontend
          format: spdx-json
          output-file: .release/site.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: |
            .release/site.tar.gz
            .release/site.spdx.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  attest:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-${{ github.sha }}
          path: dist

      - name: Verify digest matches the build
        env:
          SHA256: ${{ needs.ci.outputs.sha256 }}
        run: echo "${SHA256}  dist/site.tar.gz" | sha256sum --check --strict

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/site.tar.gz

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/site.tar.gz
          sbom-path: dist/site.spdx.json

  staging:
    needs: [ci, attest]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
      attestations: read
    uses: ./.github/workflows/frontend-deploy.yml
    with:
      environment: frontend-staging
      artifact: frontend-${{ github.sha }}
      sha256: ${{ needs.ci.outputs.sha256 }}

  production:
    needs: [ci, staging]
    if: needs.staging.outputs.deployed == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: read
    uses: ./.github/workflows/frontend-deploy.yml
    with:
      environment: frontend-production
      artifact: frontend-${{ github.sha }}
      sha256: ${{ needs.ci.outputs.sha256 }}
