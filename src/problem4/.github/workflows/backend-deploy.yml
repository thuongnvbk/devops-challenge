name: backend-deploy

# Deploys one already-built, already-attested backend artifact to one
# environment. Called by backend.yml for staging and then production.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (backend-staging | backend-production)
        type: string
        required: true
      artifact:
        description: Name of the workflow artifact produced by backend.yml
        type: string
        required: true
      sha256:
        description: Digest of api.tar.gz recorded at build time
        type: string
        required: true
    outputs:
      deployed:
        description: "'true' if the environment now runs this release"
        value: ${{ jobs.deploy.outputs.deployed }}

permissions: {}

jobs:
  deploy:
    name: deploy (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    # Covers a full refresh plus a full rollback (rollout.sh TIMEOUT_SECONDS
    # is 20 min each way), within the 1h OIDC session.
    timeout-minutes: 55
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.API_BASE_URL }}
    # One deploy or rollback per environment at a time. Never cancel a running
    # one: the refresh would carry on in AWS without anyone watching it.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: read
    outputs:
      deployed: ${{ steps.rollout.outcome == 'success' }}
    env:
      RELEASE: ${{ github.sha }}
      DEPLOY_ENV: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ASG_NAME: ${{ vars.ASG_NAME }}
      LAUNCH_TEMPLATE_ID: ${{ vars.LAUNCH_TEMPLATE_ID }}
      RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ROLLBACK_ALARM_NAMES: ${{ vars.ROLLBACK_ALARM_NAMES }}
    steps:
      - name: Check configuration
        env:
          SHA256: ${{ inputs.sha256 }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::sha256 input is not a digest"; exit 1; }
          for v in AWS_ROLE_ARN AWS_REGION ASG_NAME LAUNCH_TEMPLATE_ID RELEASE_BUCKET API_BASE_URL ROLLBACK_ALARM_NAMES; do
            [[ -n "${!v}" ]] || { echo "::error::variable $v is not set on environment $DEPLOY_ENV"; exit 1; }
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/dist

      # Deploy only bytes that (a) match the digest recorded at build time and
      # (b) carry a provenance attestation signed by backend.yml on main.
      - name: Verify digest and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ inputs.sha256 }}
          ARTIFACT: ${{ runner.temp }}/dist/api.tar.gz
        run: ci/verify-artifact.sh "$ARTIFACT" "$SHA256" .github/workflows/backend.yml

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: backend-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600

      - name: Forward-only guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployed="$(backend/deploy/rollout.sh current)"
          decision="$(ci/forward-only.sh "$deployed" "$RELEASE")"
          echo "previous=$deployed" >>"$GITHUB_OUTPUT"
          echo "decision=$decision" >>"$GITHUB_OUTPUT"

      - name: Publish release (artifact + launch template version)
        id: publish
        if: steps.guard.outputs.decision == 'deploy'
        env:
          ARTIFACT: ${{ runner.temp }}/dist/api.tar.gz
        run: |
          version="$(backend/deploy/rollout.sh publish "$ARTIFACT" "$RELEASE")"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # Exit 1: release not kept, previous verified live. Exit 2: needs a human.
      - name: Roll out (instance refresh, smoke test, automatic rollback)
        id: rollout
        if: steps.guard.outputs.decision == 'deploy'
        env:
          VERSION: ${{ steps.publish.outputs.version }}
          REFRESH_STATE_FILE: ${{ runner.temp }}/refresh-state
        run: backend/deploy/rollout.sh refresh "$VERSION"

      # Rolls back an interrupted guarded refresh; a restore in progress is
      # left to finish (rolling it back would bring back the bad release).
      - name: Handle cancellation mid-refresh
        if: cancelled() && steps.publish.outputs.version != ''
        env:
          REFRESH_STATE_FILE: ${{ runner.temp }}/refresh-state
        run: backend/deploy/rollout.sh on-cancel

      - name: Summary
        if: always()
        env:
          PREVIOUS: ${{ steps.guard.outputs.previous }}
          DECISION: ${{ steps.guard.outputs.decision }}
          OUTCOME: ${{ steps.rollout.outcome }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          {
            echo "### backend -> ${DEPLOY_ENV}"
            echo "| | |"
            echo "|---|---|"
            echo "| release | \`${RELEASE}\` |"
            echo "| previously deployed | \`${PREVIOUS:-none}\` |"
            echo "| decision | ${DECISION:-not reached} |"
            echo "| launch template version | ${VERSION:-n/a} |"
            echo "| rollout | ${OUTCOME:-skipped} |"
            if [[ -n "$PREVIOUS" ]]; then
              echo
              echo "Manual rollback: run **backend-rollback** with environment \`${DEPLOY_ENV}\` and release \`${PREVIOUS}\`."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
