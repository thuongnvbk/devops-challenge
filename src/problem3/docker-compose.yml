services:
  nginx:
    image: nginx:1.25
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      # Least-privilege role from postgres/initdb, not the superuser.
      DB_USER: app
      DB_PASSWORD: ${APP_DB_PASSWORD:-app-local-dev}
      DB_NAME: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      # Redis only holds telemetry: the api serves without it.
      redis:
        condition: service_started
    healthcheck:
      # Readiness gates on Postgres; Redis is reported, not gated. Worst case ~3s.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/ready"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_DB_USER: app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app-local-dev}
    volumes:
      # Runs on first boot only (empty data directory); see SOLUTION.md.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP on purpose: during first-boot init the entrypoint runs a
      # temporary server on the Unix socket only, so a socket check passes
      # while the api still gets ECONNREFUSED.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
